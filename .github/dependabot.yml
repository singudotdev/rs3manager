version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    # Changes go to develop and reach main only through a tested release; PRs against main were closed unmerged.
    target-branch: develop
    schedule:
      interval: weekly
    # One PR a week for compatible bumps instead of one per crate; breaking ones still come alone.
    groups:
      cargo:
        update-types: [minor, patch]
    ignore:
      # GPUI is a git dependency pinned to one Zed tag, with the patches in Cargo.toml: it moves by hand.
      - dependency-name: gpui
      - dependency-name: gpui_platform
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Its refs name the Rust toolchain (`stable`), not versions of the action.
      - dependency-name: dtolnay/rust-toolchain
