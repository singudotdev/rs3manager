# Mutation testing of each pull request's change: every changed line of the modules `.cargo/mutants.toml` examines is
# altered (`==` for `!=`, a body for `Ok(())`…) and the tests run again; a change no test notices is a behavior
# nothing guards (docs/development.md#mutation-testing).
name: Mutants

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # As in ci.yml: what the app (GPUI) needs to build on Linux.
  GUI_LINUX_DEPS: libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan1

jobs:
  mutants:
    name: mutants
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: |
          # shellcheck disable=SC2086 # one package per word
          sudo apt-get update && sudo apt-get install -y $GUI_LINUX_DEPS
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Mutants of the changed lines
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff "$BASE"...HEAD -- '*.rs' > change.diff
          if [ ! -s change.diff ]; then echo "no Rust changed"; exit 0; fi
          # 3 is a mutant whose tests hung, cut at the timeout: caught. A missed one fails below either way.
          status=0
          cargo mutants --in-diff change.diff --workspace --no-shuffle -j 2 || status=$?
          if [ -s mutants.out/missed.txt ]; then echo "missed:"; cat mutants.out/missed.txt; exit 1; fi
          if [ "$status" != 0 ] && [ "$status" != 3 ]; then exit "$status"; fi
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutants
          path: mutants.out
