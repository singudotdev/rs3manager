[workspace]
resolver = "3"
members = ["core", "gui"]
# `cargo build` / `cargo test` at the top cover the core only, which builds without GPUI. The app needs
# `-p rs3manager-app` or `--workspace`.
default-members = ["core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://github.com/singudotdev/rs3manager"

[workspace.dependencies]
rs3manager-core = { path = "core", version = "0.1.0" }
thiserror = "2"
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"
# Binaries and a crate only they use: no public API to document errors and panics for, or to mark #[must_use].
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"

[profile.release]
strip = true
lto = true

# The patches Zed 1.23.2 builds GPUI with (from its workspace Cargo.toml and Cargo.lock); a git dependency doesn't
# carry them over. Same pin as kanbrain, where it was found to draw on NVIDIA + Wayland.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "eb6b4fd17b9af5ecc226546bdd04185391b3e265" }
