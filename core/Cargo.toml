[package]
name = "r3manager-core"
description = "r3manager's core: the AWS CLI's profiles and the S3 operations on the buckets and objects of a radosgw account."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
aws-config = { version = "1.13", features = ["behavior-version-latest"] }
# The SDK's own profile file set, which aws-config's deprecated aliases point to.
aws-runtime = "1.10"
# What the profile's own IAM policies allow, so the window shows only that (docs/decisions/0004-*).
aws-sdk-iam = { version = "1.133", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1.157", features = ["behavior-version-latest"] }
# Parsing those policy documents; already in the tree through GPUI.
serde_json = "1"
# Wrapping IAM answers radosgw 19.2 orders wrongly for the SDK (src/s3/rgw_iam.rs): the SDK's own body and http-body
# 1, all already in the tree under the SDK.
aws-smithy-types = { version = "1.9", features = ["http-body-1-x"] }
bytes = "1"
http-body = "1"
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "sync"] }
tracing = "0.1"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
