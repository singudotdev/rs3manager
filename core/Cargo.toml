[package]
name = "r3manager-core"
description = "r3manager's core: the AWS CLI's profiles and the S3 operations on the buckets and objects of a radosgw account."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
aws-config = { version = "1.13", features = ["behavior-version-latest"] }
# The SDK's own profile file set, which aws-config's deprecated aliases point to.
aws-runtime = "1.10"
aws-sdk-s3 = { version = "1.157", features = ["behavior-version-latest"] }
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "sync"] }
tracing = "0.1"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
