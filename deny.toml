# What `cargo deny check` (run by CI) accepts in the dependency tree.

[advisories]
# No release of these is compatible with what pulls them in. They're checked again whenever the AWS SDK or GPUI moves.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, unmaintained, through gpui's font stack" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz, unmaintained, through gpui's usvg" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant, merged into zbus 6, through gpui on Linux" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, merged into zbus 6, through gpui on Linux" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, merged into zbus 6, through gpui on Linux" },
    { id = "RUSTSEC-2026-0543", reason = "chrono, unmaintained, through gpui" },
    { id = "RUSTSEC-2024-0436", reason = "paste, unmaintained, through gpui's macOS and font crates" },
    # The AWS SDK's HTTP client (aws-smithy-http-client) still carries hyper 0.14 with h2 0.3, rustls 0.21 and
    # rustls-webpki 0.101, which these advisories fix only in newer lines; the SDK is what has to move off them.
    { id = "RUSTSEC-2026-0258", reason = "h2 0.3, through aws-smithy-http-client's legacy hyper 0.14" },
    { id = "RUSTSEC-2026-0346", reason = "rustls 0.21, through aws-smithy-http-client's legacy hyper-rustls 0.24" },
    { id = "RUSTSEC-2026-0349", reason = "rustls 0.21, through aws-smithy-http-client's legacy hyper-rustls 0.24" },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.101, through aws-smithy-http-client's legacy rustls 0.21" },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.101, through aws-smithy-http-client's legacy rustls 0.21" },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.101, through aws-smithy-http-client's legacy rustls 0.21" },
    { id = "RUSTSEC-2026-0382", reason = "rustls-webpki 0.101, through aws-smithy-http-client's legacy rustls 0.21" },
]

[licenses]
# Licenses an AGPL-3.0-only program may include.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
# The kanban app's crate isn't published.
ignore = true

[bans]
# GPUI's tree carries two versions of a few crates; that's GPUI's to resolve.
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# GPUI comes from Zed's repository, with the forks Zed builds it with.
allow-git = [
    "https://github.com/gfx-rs/wgpu",
    "https://github.com/zed-industries/async-process.git",
    "https://github.com/smol-rs/async-task.git",
    "https://github.com/proptest-rs/proptest",
    "https://github.com/zed-industries/calloop",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/oo7",
    "https://github.com/zed-industries/wasm_thread",
    "https://github.com/zed-industries/xim-rs.git",
    "https://github.com/zed-industries/zed",
]
